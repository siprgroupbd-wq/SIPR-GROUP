<html lang="en">
<head>

<title>SIPR Group</title>

<style>
:root{
  --bg:#050709;--sur:#0b0d14;--s2:#0f1219;--s3:#141720;
  --bor:#181c28;--bor2:#1e2235;--txt:#e8eaf2;--mut:#434966;--mut2:#636b88;
  --grn:#3b82f6;--grn2:#1d4ed8;--gdm:#060e1c;--gbr:#0c1e40;
  --gold:#f59e0b;--purple:#8b5cf6;--red:#ef4444;--teal:#06b6d4;
  --green:#10b981;--orange:#f97316;
  --sh:0 4px 24px #00000060;--sh2:0 8px 40px #00000080;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
#pg-login{min-height:100vh;align-items:center;justify-content:center;background:radial-gradient(ellipse at 20% 20%,#091525,var(--bg) 65%);display:flex;}
.lbox{background:var(--sur);border:1px solid var(--bor2);border-radius:24px;padding:40px 36px;width:100%;max-width:400px;box-shadow:var(--sh2);}
.lbl{display:block;font-size:10px;letter-spacing:2.5px;color:var(--mut2);font-weight:700;margin-bottom:7px;text-transform:uppercase;}
.inp{width:100%;background:var(--s2);border:1px solid var(--bor);border-radius:12px;padding:12px 14px;color:var(--txt);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s;}
.inp:focus{border-color:var(--grn);box-shadow:0 0 0 3px #3b82f614;}
select.inp{cursor:pointer;}textarea.inp{resize:vertical;}
.btn-p{width:100%;padding:14px;background:linear-gradient(135deg,var(--grn2),var(--grn));color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation;box-shadow:0 4px 16px #3b82f630;}
.btn-g{width:100%;padding:13px;background:var(--s2);border:1px solid var(--bor2);color:var(--txt);border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;touch-action:manipulation;}
.btn-a{background:var(--gdm);color:var(--grn);border:1px solid var(--gbr);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.btn-s{background:var(--s2);color:var(--txt);border:1px solid var(--bor);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.btn-d{background:#1a040699;color:#ef4444;border:1px solid #7f1d1d55;border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.btn-wa{background:#071a0f;color:#25d366;border:1px solid #25d36633;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.divider{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:11px;margin:16px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--bor);}
.err{color:#f87171;font-size:12px;padding:11px 14px;background:#1a060699;border-radius:10px;border:1px solid #7f1d1d;margin-top:10px;display:none;}
#pg-app{display:none;min-height:100vh;}
#sidebar{width:230px;background:var(--sur);border-right:1px solid var(--bor);display:flex;flex-direction:column;padding:18px 12px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:100;transition:transform .25s;}
.nav-logo{text-align:center;padding:6px 0 18px;border-bottom:1px solid var(--bor);margin-bottom:14px;}
.nav-logo .logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--gbr),var(--grn));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;margin:0 auto 9px;box-shadow:0 4px 20px #3b82f640;}
.nav-logo .logo-name{font-size:15px;font-weight:900;letter-spacing:.5px;}
.nav-logo .logo-sub{font-size:8px;letter-spacing:3.5px;color:var(--mut);margin-top:2px;text-transform:uppercase;}
.nav-section{font-size:9px;letter-spacing:2.5px;color:var(--mut);font-weight:700;padding:8px 10px 4px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mut2);margin-bottom:2px;transition:all .15s;touch-action:manipulation;}
.nav-item:hover{background:var(--s2);color:var(--txt);}
.nav-item.active{background:linear-gradient(135deg,var(--gdm),#091828);color:var(--grn);border:1px solid var(--gbr);}
.nav-item .nav-ic{width:20px;text-align:center;font-size:16px;}
#main{margin-left:230px;flex:1;padding:26px 30px;max-width:980px;}
#topbar{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
#topbar h2{font-size:21px;font-weight:900;flex:1;letter-spacing:-.5px;}
#ham{display:none;background:var(--s2);border:1px solid var(--bor);border-radius:10px;padding:9px 12px;font-size:18px;cursor:pointer;color:var(--txt);touch-action:manipulation;}
@media(max-width:800px){
  #sidebar{transform:translateX(-230px);}
  #sidebar.open{transform:translateX(0);box-shadow:12px 0 48px #00000099;}
  #main{margin-left:0;padding:14px 14px 90px;}
  #ham{display:block;}
  #bot-nav{display:flex!important;}
  .hide-mob{display:none!important;}
}
#bot-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--bor);z-index:100;padding:6px 4px 8px;box-shadow:0 -4px 24px #00000060;}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;cursor:pointer;color:var(--mut);font-size:9px;font-weight:700;border:none;background:none;font-family:inherit;touch-action:manipulation;border-radius:8px;}
.bn.active{color:var(--grn);}
.bn .bi{font-size:20px;line-height:1;}
#overlay{display:none;position:fixed;inset:0;background:#00000088;z-index:99;}
.card{background:var(--sur);border:1px solid var(--bor);border-radius:18px;padding:22px;}
.sc{background:var(--s2);border:1px solid var(--bor);border-radius:14px;padding:15px;}
.hero{background:linear-gradient(140deg,var(--gdm) 0%,#080f1e 100%);border:1px solid var(--gbr);border-radius:20px;padding:26px 30px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,#3b82f60a,transparent 70%);border-radius:50%;pointer-events:none;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:600px){.g4{grid-template-columns:1fr 1fr;}.g3{grid-template-columns:1fr 1fr;}.g2-mob{grid-template-columns:1fr!important;}}
.fc{display:flex;flex-direction:column;gap:16px;}
.tab-row{display:flex;gap:6px;flex-wrap:wrap;}
.tab{background:var(--s2);border:1px solid var(--bor);border-radius:9px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;color:var(--mut2);font-family:inherit;touch-action:manipulation;}
.tab.active{background:var(--gdm);border-color:var(--gbr);color:var(--grn);}
.bdg{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.3px;}
.pbar{height:4px;background:var(--s2);border-radius:99px;overflow:hidden;}
.pfill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--grn2),var(--grn));}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:10px 13px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--mut2);font-weight:700;border-bottom:1px solid var(--bor);text-transform:uppercase;}
.tbl td{padding:12px 13px;border-bottom:1px solid var(--bor);font-size:13px;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover{background:var(--s2);}
.sw{overflow-x:auto;}
.modal-bg{position:fixed;inset:0;background:#00000094;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--sur);border:1px solid var(--bor2);border-radius:22px;padding:28px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh2);}
#prof-btn{position:relative;cursor:pointer;touch-action:manipulation;}
#prof-drop{display:none;position:absolute;top:52px;right:0;background:var(--sur);border:1px solid var(--bor2);border-radius:18px;padding:12px;min-width:220px;z-index:200;box-shadow:var(--sh2);}
#toast{display:none;position:fixed;bottom:90px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:14px;font-size:13px;font-weight:700;z-index:9999;white-space:nowrap;box-shadow:var(--sh2);}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;margin-right:6px;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
.pb-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--bor);}
.pb-row:last-child{border-bottom:none;}
.col-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bor);}
.col-row:last-child{border-bottom:none;}
.stat-box{background:var(--s2);border:1px solid var(--bor);border-radius:14px;padding:15px;text-align:center;}
.stat-box .val{font-size:17px;font-weight:900;margin-top:5px;letter-spacing:-.5px;}
.stat-box .lbl2{font-size:9px;color:var(--mut2);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
#pg-invite{display:none;min-height:100vh;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,#0d1f4a,var(--bg));}
input[type=checkbox].tog{width:40px;height:22px;appearance:none;-webkit-appearance:none;background:var(--bor2);border-radius:99px;cursor:pointer;transition:background .2s;position:relative;flex-shrink:0;border:none;outline:none;}
input[type=checkbox].tog:checked{background:var(--grn);}
input[type=checkbox].tog::after{content:'';width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .18s;box-shadow:0 1px 4px #00000040;}
input[type=checkbox].tog:checked::after{left:21px;}
.perm-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bor);}
.perm-row:last-child{border-bottom:none;}
.prio-high{color:#ef4444;background:#1a040499;border:1px solid #7f1d1d44;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;}
.prio-med{color:#f59e0b;background:#1c0e0099;border:1px solid #78350f44;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;}
.prio-low{color:#3b82f6;background:#06102099;border:1px solid #1e3a5f44;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--bor);}
.task-row:last-child{border-bottom:none;}
.rem-card{background:var(--s2);border:1px solid var(--bor);border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:12px;}
/* PROJECT SYSTEM */
.proj-card{background:var(--sur);border:1px solid var(--bor);border-radius:18px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .15s,box-shadow .2s;}
.proj-card:hover{border-color:var(--bor2);transform:translateY(-2px);box-shadow:0 8px 32px #00000050;}
.proj-tab-bar{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--bor);scrollbar-width:none;}
.proj-tab-bar::-webkit-scrollbar{display:none;}
.proj-tab{padding:14px 20px;border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--mut2);border-bottom:2px solid transparent;touch-action:manipulation;white-space:nowrap;flex-shrink:0;transition:color .15s;}
.proj-tab.active{color:var(--grn);border-bottom-color:var(--grn);}
.proj-page{background:var(--sur);border:1px solid var(--bor);border-radius:20px;overflow:hidden;}
</style>
</head>

// ═══════════ HELPERS ═══════════
function $(i){return document.getElementById(i);}
function mob(){return window.innerWidth<800;}
function fmt(n){return"BDT "+(Number(n||0)).toLocaleString("en-BD");}
function fd(d){if(!d)return"—";try{return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});}catch(e){return"—";}}
function now(){return new Date().toISOString();}
function sumT(arr,t){return arr.filter(function(x){return x.type===t;}).reduce(function(s,x){return s+Number(x.amount);},0);}
function pct(v,mx){return Math.min(Math.round(v/mx*100),100);}
function av(name,sz){
  sz=sz||36;
  var h=(name||"?").split("").reduce(function(a,c){return a+c.charCodeAt(0);},0)%360;
  var ini=(name||"?").split(" ").map(function(w){return w[0]||"";}).join("").slice(0,2).toUpperCase();
  return "<div style='width:"+sz+"px;height:"+sz+"px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,hsl("+h+",40%,20%),hsl("+((h+50)%360)+",50%,30%));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:"+Math.round(sz*.35)+"px'>"+ini+"</div>";
}
function txbdg(t){var c=TC[t]||TC.deposit;return "<span class='bdg' style='background:"+c.B+";color:"+c.C+";border:1px solid "+c.BD+"'>"+c.I+" "+c.L+"</span>";}
var _tt;
function toast(m,ok){ok=ok!==false;var t=$("toast");t.style.background=ok?"linear-gradient(135deg,#0a1226,#0d1f4a)":"linear-gradient(135deg,#1a0404,#2a0808)";t.style.border="1px solid "+(ok?"var(--grn)":"#ef4444");t.style.color=ok?"var(--grn)":"#f87171";t.textContent=(ok?"✓ ":"✗ ")+m;t.style.display="block";clearTimeout(_tt);_tt=setTimeout(function(){t.style.display="none";},3500);}
function getMem(email){return S.mems.find(function(m){return m.email===email;})||{};}
function resolveUID(t){if(t.memberUID&&t.memberUID.indexOf("SIPR26")===0)return t.memberUID;if(t.memberEmail){var mx=S.mems.find(function(x){return x.email===t.memberEmail;});if(mx)return mx.id;}if(t.member){var u=NAME_MAP[t.member.toLowerCase().trim()];if(u)return u;}return null;}
function txName(t){var u=resolveUID(t);if(u){var m=S.mems.find(function(x){return x.id===u;});if(m)return m.name;}return t.member||"Unknown";}
function txMatch(t,mem){var u=resolveUID(t);if(u)return u===mem.id;return t.member===mem.name;}
// Permission helpers
function hasPerm(perm){
  if(S.role==="admin")return true;
  var me=getMem(S.email);var perms=me.permissions||{};
  if(perm==="addTransaction"&&S.role==="finance")return true;
  if((perm==="sendNotices"||perm==="uploadDocuments")&&S.role==="secretary")return true;
  if(perm==="sendPaymentReminder"&&S.role==="finance")return true;
  return!!perms[perm];
}
function isAdmin(){return S.role==="admin";}
function canWrite(){return hasPerm("addTransaction");}
function canAnnounce(){return hasPerm("sendNotices");}
function canUploadDoc(){return hasPerm("uploadDocuments");}
function canRemind(){return S.role==="admin"||hasPerm("sendPaymentReminder");}
function canManageProj(){return S.role==="admin"||S.role==="finance"||hasPerm("manageProjects");}
// Avatar helpers
function avPhoto(name,sz,photo){
  sz=sz||36;
  if(photo)return"<div style='width:"+sz+"px;height:"+sz+"px;border-radius:50%;flex-shrink:0;overflow:hidden;border:2px solid var(--bor)'><img src='"+photo+"' style='width:100%;height:100%;object-fit:cover'/></div>";
  var h2=(name||"?").split("").reduce(function(a,c){return a+c.charCodeAt(0);},0)%360;
  var ini=(name||"?").split(" ").map(function(w){return w[0]||"";}).join("").slice(0,2).toUpperCase();
  return"<div style='width:"+sz+"px;height:"+sz+"px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,hsl("+h2+",40%,20%),hsl("+((h2+50)%360)+",50%,30%));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:"+Math.round(sz*.35)+"px'>"+ini+"</div>";
}
function avM(m,sz){return avPhoto(m.name,sz,m.photo||m.photoData);}
function showErr(id,msg){var el=$(id);if(el){el.textContent=msg;el.style.display="block";}}
function hideErr(id){var el=$(id);if(el)el.style.display="none";}

// ═══════════ AUTH ═══════════
function gLogin(){fa.signInWithPopup(gp).catch(function(e){showErr("lerr",e.message);});}
function eLogin(){
  var em=($("em")||{value:""}).value.trim().toLowerCase();
  var pw=($("pw")||{value:""}).value;
  if(!em||!pw){showErr("lerr","Enter email and password.");return;}
  hideErr("lerr");
  fa.signInWithEmailAndPassword(em,pw).catch(function(e){
    showErr("lerr",e.code==="auth/user-not-found"?"Email not found.":e.code==="auth/wrong-password"||e.code==="auth/invalid-credential"?"Wrong password.":e.message);
  });
}
function fPass(){var em=($("em")||{value:""}).value.trim();if(!em){showErr("lerr","Enter your email first.");return;}fa.sendPasswordResetEmail(em).then(function(){toast("Reset email sent!");}).catch(function(e){showErr("lerr",e.message);});}
function showReg(){$("lf").style.display="none";$("rf").style.display="block";hideErr("lerr");}
function showLogin(){$("lf").style.display="block";$("rf").style.display="none";hideErr("lerr");}
function doReg(){
  var name=($("rn")||{value:""}).value.trim();
  var email=($("re")||{value:""}).value.trim().toLowerCase();
  var pass=($("rp")||{value:""}).value;
  var code=($("rc")||{value:""}).value.trim().toUpperCase();
  if(!name||!email||!pass||!code){showErr("lerr","All fields required.");return;}
  if(pass.length<6){showErr("lerr","Password min 6 characters.");return;}
  var mem=S.mems.find(function(m){return m.id.toUpperCase()===code;});
  if(!mem){showErr("lerr","Invalid invite code. Ask Jahed.");return;}
  fa.createUserWithEmailAndPassword(email,pass).then(function(cred){
    return db.collection("members").doc(mem.id).update({email:email,name:name,authUid:cred.user.uid,status:"pending",_registered:true,pendingAt:now()});
  }).then(function(){
    db.collection("pendingApprovals").add({memberId:mem.id,name:name,email:email,requestedAt:now(),status:"pending"}).catch(function(){});
    showLogin();hideErr("lerr");toast("Registration submitted! Wait for admin approval.");
  }).catch(function(e){showErr("lerr",e.message);});
}
function linkCode(){
  var code=($("ic")||{value:""}).value.trim().toUpperCase();
  if(!code){showErr("ierr","Enter your invite code.");return;}
  var user=fa.currentUser;if(!user){showErr("ierr","Not signed in.");return;}
  var mem=S.mems.find(function(m){return m.id.toUpperCase()===code;})||DEF_MEMS.find(function(m){return m.id.toUpperCase()===code;});
  if(!mem){showErr("ierr","Invalid code. Ask Jahed.");return;}
  if(mem.googleUid&&mem.googleUid!==user.uid){showErr("ierr","This code is already linked to another account.");return;}
  var upd={googleUid:user.uid,googleEmail:user.email,_registered:true};
  var inFS=!!S.mems.find(function(m){return m.id.toUpperCase()===code;});
  var p=inFS?db.collection("members").doc(mem.id).update(upd):db.collection("members").doc(mem.id).set(Object.assign({},mem,upd));
  p.then(function(){
    Object.assign(mem,upd);
    if(!inFS)S.mems.push(mem);
    S.email=mem.email;S.name=mem.name||user.displayName;S.uid=user.uid;S.role=mem.role||"member";
    $("pg-invite").style.display="none";
    initApp();toast("Welcome to SIPR, "+mem.name+"!");
  }).catch(function(e){showErr("ierr","Error: "+e.message);});
}
