<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>SIPR Group</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<style>
:root{--bg:#0c1021;--sur:#141d35;--s2:#1a2540;--bor:#253051;--bor2:#304070;--txt:#e8eeff;--mut:#7e8db8;--mut2:#a0b0d0;--grn:#4d9fff;--grn2:#2065cc;--gdm:#090d1a;--gbr:#1e2845;--gold:#f4c542;--purple:#a78bfa;--red:#fc5c65;--teal:#26c6da;--green:#26d982;--orange:#ff8c42;--amber:#f4c542;--pending:#ff8c42;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;}
.page{display:none;}
/* LOGIN */
#pg-login{min-height:100vh;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,#0d1f4a,var(--bg));display:flex;}
.lbox{background:var(--sur);border:1px solid var(--bor);border-radius:20px;padding:36px 32px;width:100%;max-width:400px;}
.lbl{display:block;font-size:10px;letter-spacing:2px;color:var(--mut);font-weight:700;margin-bottom:6px;}
.inp{width:100%;background:var(--s2);border:1px solid var(--bor);border-radius:10px;padding:11px 13px;color:var(--txt);font-size:14px;font-family:inherit;outline:none;transition:border .15s;}
.inp:focus{border-color:var(--grn);}
select.inp{cursor:pointer;}textarea.inp{resize:vertical;}
.btn-p{width:100%;padding:13px;background:linear-gradient(135deg,var(--gbr),var(--grn));color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.btn-g{width:100%;padding:12px;background:var(--s2);border:1px solid var(--bor);color:var(--txt);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;touch-action:manipulation;}
.btn-a{background:var(--gdm);color:var(--grn);border:1px solid var(--gbr);border-radius:9px;padding:8px 15px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.btn-s{background:var(--s2);color:var(--txt);border:1px solid var(--bor);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.btn-d{background:#1a040688;color:#ef4444;border:1px solid #78140044;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.divider{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:11px;margin:14px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--bor);}
.err{color:var(--orange);font-size:12px;padding:10px 13px;background:#1a060688;border-radius:8px;border:1px solid #7f1d1d;margin-top:10px;display:none;}
/* APP */
#pg-app{display:none;min-height:100vh;}
#sidebar{width:220px;background:var(--sur);border-right:1px solid var(--bor);display:flex;flex-direction:column;padding:16px 10px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:100;transition:transform .25s;}
.nav-logo{text-align:center;padding:8px 0 14px;border-bottom:1px solid var(--bor);margin-bottom:10px;}
.nav-logo .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--gbr),var(--grn));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#fff;margin:0 auto 6px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:1px;transition:all .15s;touch-action:manipulation;}
.nav-item:hover{background:var(--s2);color:var(--txt);}
.nav-item.active{background:var(--gdm);color:var(--grn);}
#main{margin-left:220px;flex:1;padding:20px 24px;max-width:960px;}
#topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--bor);}
#topbar h2{font-size:19px;font-weight:900;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#ham{display:none;background:var(--s2);border:1px solid var(--bor);border-radius:8px;padding:8px 11px;font-size:18px;cursor:pointer;color:var(--txt);touch-action:manipulation;}
@media(max-width:800px){
  #sidebar{transform:translateX(-220px);}
  #sidebar.open{transform:translateX(0);box-shadow:8px 0 40px #00000099;}
  #main{margin-left:0;padding:13px 13px 80px;}
  #ham{display:block;}
  #bot-nav{display:flex!important;}
  .hide-mob{display:none!important;}
}
#bot-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--bor);z-index:100;padding:5px 0 7px;}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 3px;cursor:pointer;color:var(--mut);font-size:9px;font-weight:700;border:none;background:none;font-family:inherit;touch-action:manipulation;}
.bn.active{color:var(--grn);}
.bn .bi{font-size:18px;}
#overlay{display:none;position:fixed;inset:0;background:#00000070;z-index:99;}
/* Cards */
.card{background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:18px;}
.sc{background:var(--s2);border:1px solid var(--bor);border-radius:12px;padding:14px;}
.hero{background:linear-gradient(135deg,var(--gdm),#0d1424);border:1px solid var(--gbr);border-radius:16px;padding:22px 26px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:600px){.g4{grid-template-columns:1fr 1fr;}.g3{grid-template-columns:1fr 1fr;}.g2-mob{grid-template-columns:1fr!important;}}
.fc{display:flex;flex-direction:column;gap:14px;}
.tab-row{display:flex;gap:5px;flex-wrap:wrap;}
.tab{background:var(--s2);border:1px solid var(--bor);border-radius:7px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;color:var(--mut);font-family:inherit;touch-action:manipulation;}
.tab.active{background:var(--gdm);border-color:var(--gbr);color:var(--grn);}
.bdg{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;}
.pbar{height:5px;background:var(--s2);border-radius:99px;overflow:hidden;}
.pfill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gbr),var(--grn));}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:9px 12px;text-align:left;font-size:10px;letter-spacing:1.5px;color:var(--mut);font-weight:700;border-bottom:1px solid var(--bor);}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--bor);font-size:13px;}
.tbl tr:last-child td{border-bottom:none;}
.sw{overflow-x:auto;}
.modal-bg{position:fixed;inset:0;background:#00000088;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--sur);border:1px solid var(--bor);border-radius:18px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
#prof-btn{position:relative;cursor:pointer;touch-action:manipulation;}
#prof-drop{display:none;position:absolute;top:46px;right:0;background:var(--sur);border:1px solid var(--bor);border-radius:14px;padding:10px;min-width:210px;z-index:200;box-shadow:0 16px 48px #000000aa;}
#toast{display:none;position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;z-index:9999;white-space:nowrap;box-shadow:0 8px 24px #00000060;}
.live{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--grn);animation:pulse 2s infinite;margin-right:5px;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
.pb-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bor);}
.pb-row:last-child{border-bottom:none;}
/* Collection tracker */
.col-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bor);}
.col-row:last-child{border-bottom:none;}
.stat-box{background:var(--s2);border:1px solid var(--bor);border-radius:10px;padding:12px;text-align:center;}
.stat-box .val{font-size:16px;font-weight:900;margin-top:4px;}
.stat-box .lbl2{font-size:9px;color:var(--mut);font-weight:700;letter-spacing:1px;}
/* Invite page */
#pg-invite{display:none;min-height:100vh;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,#0d1f4a,var(--bg));}

.proj-card{background:var(--sur);border:1px solid var(--bor);border-radius:18px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .15s;}
.proj-card:hover{border-color:var(--bor2);transform:translateY(-2px);}
.proj-tab-bar{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--bor);scrollbar-width:none;}
.proj-tab-bar::-webkit-scrollbar{display:none;}
.proj-tab{padding:11px 16px;border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;touch-action:manipulation;}
.proj-tab.active{color:var(--grn);border-bottom-color:var(--grn);}
input[type=checkbox].tog{width:38px;height:20px;appearance:none;-webkit-appearance:none;background:var(--bor2);border-radius:99px;cursor:pointer;transition:background .2s;position:relative;flex-shrink:0;border:none;outline:none;}
input[type=checkbox].tog:checked{background:var(--grn);}
input[type=checkbox].tog::after{content:'';width:14px;height:14px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .18s;}
input[type=checkbox].tog:checked::after{left:21px;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 7px var(--pending);}50%{opacity:.5;box-shadow:0 0 16px var(--pending);}}
@media(max-width:800px){[style*="grid-template-columns:1fr 240px"]{grid-template-columns:1fr!important;}}


/* ══════════════════════════════════════════
   LIGHT MODE — Clean White Professional
══════════════════════════════════════════ */
body.light{
  --bg:#ffffff;
  --sur:#f8f9ff;
  --s2:#eef0ff;
  --bor:#cdd2ee;
  --bor2:#9aa8e0;
  --txt:#0d1333;
  --mut:#4a5490;
  --mut2:#333c7a;
  --grn:#1565cc;        /* dark blue – visible on white */
  --grn2:#0d47a1;
  --gdm:#e8ebff;
  --gbr:#c0caee;
  --gold:#b8860b;       /* dark amber */
  --purple:#6a1b9a;     /* dark violet */
  --red:#c62828;        /* dark red */
  --teal:#00838f;       /* dark teal */
  --green:#1b7a3e;      /* dark emerald */
  --orange:#d84315;     /* dark orange */
  --amber:#b8860b;
  --pending:#d84315;    /* dark orange – clear on white */
}
/* ── Structural ── */
body.light #sidebar{background:#fff;border-right:1px solid #cdd2ee;box-shadow:4px 0 20px #00000010;}
body.light #topbar{background:#fffffff0;border-bottom-color:#cdd2ee;}
body.light #bot-nav{background:#fff;border-top:1px solid #cdd2ee;box-shadow:0 -4px 20px #00000008;}
body.light #overlay{background:#00000030;}
/* ── Cards & surfaces ── */
body.light .card{background:#fff;border-color:#cdd2ee;box-shadow:0 2px 12px #1565cc0c;}
body.light .hero{background:linear-gradient(135deg,#eef0ff,#f8f9ff);border-color:#cdd2ee;}
body.light .stat-box{background:#f3f5ff;border-color:#cdd2ee;}
body.light .lbox{background:#fff;box-shadow:0 16px 48px #00000018;}
body.light .proj-card{background:#fff;border-color:#cdd2ee;}
body.light .proj-card:hover{border-color:#9aa8e0;box-shadow:0 4px 20px #1565cc10;}
/* ── Inputs ── */
body.light .inp{background:#f3f5ff;border-color:#cdd2ee;color:#0d1333;}
body.light .inp:focus{border-color:#1565cc;box-shadow:0 0 0 3px #1565cc15;outline:none;}
/* ── Buttons ── */
body.light .btn-p{background:linear-gradient(135deg,#1565cc,#6a1b9a);color:#fff;border:none;}
body.light .btn-a{background:#1565cc;color:#fff;border-color:#1565cc;}
body.light .btn-s{background:#eef0ff;border-color:#cdd2ee;color:#1565cc;}
body.light .btn-d{background:#fff1f1;border-color:#f5b5b5;color:#c62828;}
body.light .btn-g{background:#fff;border:1px solid #cdd2ee;color:#0d1333;box-shadow:0 1px 4px #00000010;}
/* ── Modal ── */
body.light .modal-box{background:#fff;border-color:#cdd2ee;box-shadow:0 24px 80px #00000020;}
body.light .modal-bg{background:#00000040;}
/* ── Tables ── */
body.light .tbl thead tr{background:#eef0ff;}
body.light .tbl th{color:#0d1333;font-weight:800;}
body.light .tbl td{border-bottom-color:#e0e4f4;}
body.light .tbl tr:hover{background:#f3f5ff;}
body.light .sw::-webkit-scrollbar-track{background:#eef0ff;}
body.light .sw::-webkit-scrollbar-thumb{background:#9aa8e0;}
/* ── Tabs ── */
body.light .tab-row{border-color:#cdd2ee;}
body.light .tab{color:#4a5490;}
body.light .tab.active{color:#1565cc;border-bottom-color:#1565cc;}
body.light .proj-tab-bar{border-bottom-color:#cdd2ee;}
body.light .proj-tab{color:#4a5490;}
body.light .proj-tab.active{color:#1565cc;border-bottom-color:#1565cc;}
/* ── Navigation ── */
body.light .si{color:#4a5490;}
body.light .bn{color:#4a5490;}
body.light .bn.active{color:#1565cc;}
body.light #theme-btn{background:#eef0ff;border-color:#cdd2ee;color:#1565cc;}
body.light #ham{color:#0d1333;}
body.light #back-ham{background:#eef0ff;border-color:#cdd2ee;color:#1565cc;}
/* ── Profile & misc ── */
body.light #prof-drop{background:#fff;border-color:#cdd2ee;box-shadow:0 12px 40px #00000018;}
body.light #toast{background:#0d1333;color:#fff;}
body.light .bdg{border-color:#cdd2ee;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="pg-login">
  <div class="lbox">
    <div style="text-align:center;margin-bottom:22px">
      <div style="width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--gbr),var(--grn));display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff;margin:0 auto 11px">S</div>
      <div style="font-size:20px;font-weight:900">SIPR GROUP</div>
      <div style="font-size:10px;letter-spacing:3px;color:var(--mut);margin-top:3px">INVEST · GROW · PROSPER</div>
    </div>
    <button class="btn-g" onclick="gLogin()">
      <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
    <div class="divider">OR</div>
    <div id="lf">
      <div style="margin-bottom:11px"><label class="lbl">Email</label><input id="em" type="email" class="inp" placeholder="your@email.com" autocomplete="email"/></div>
      <div style="margin-bottom:14px"><label class="lbl">Password</label>
        <div style="position:relative"><input id="pw" type="password" class="inp" style="padding-right:44px" placeholder="Password" autocomplete="current-password"/>
        <button onclick="var i=document.getElementById('pw');i.type=i.type=='password'?'text':'password'" style="position:absolute;right:0;top:0;bottom:0;width:42px;background:none;border:none;color:var(--mut);cursor:pointer;font-size:17px">👁</button></div>
      </div>
      <button class="btn-p" onclick="eLogin()">Login →</button>
      <div style="display:flex;justify-content:space-between;margin-top:11px">
        <button onclick="showReg()" style="background:none;border:none;color:var(--mut);font-size:12px;cursor:pointer;font-family:inherit">New member? Register</button>
        <button onclick="fPass()" style="background:none;border:none;color:var(--mut);font-size:12px;cursor:pointer;font-family:inherit">Forgot password?</button>
      </div>
    </div>
    <div id="rf" style="display:none">
      <div style="font-size:15px;font-weight:800;color:var(--grn);margin-bottom:12px">New Member Registration</div>
      <div style="display:flex;flex-direction:column;gap:9px;margin-bottom:12px">
        <div><label class="lbl">Full Name</label><input id="rn" type="text" class="inp" placeholder="Your full name"/></div>
        <div><label class="lbl">Email</label><input id="re" type="email" class="inp" placeholder="your@email.com"/></div>
        <div><label class="lbl">Password (min 6)</label><input id="rp" type="password" class="inp" placeholder="Create password"/></div>
        <div><label class="lbl">Invite Code</label><input id="rc" type="text" class="inp" placeholder="e.g. SIPR26-SH-4688" autocorrect="off" autocapitalize="characters"/><div style="font-size:11px;color:var(--mut);margin-top:4px">Get your code from Jahed (Admin)</div></div>
      </div>
      <button class="btn-p" onclick="doReg()">Submit Registration</button>
      <button onclick="showLogin()" style="width:100%;background:none;border:none;color:var(--mut);font-size:12px;cursor:pointer;font-family:inherit;margin-top:9px">← Back to login</button>
    </div>
    <div id="lerr" class="err"></div>
    <div style="text-align:center;margin-top:14px;font-size:11px;color:var(--mut)">PRIVATE &amp; CONFIDENTIAL · SIPR GROUP © 2026</div>
  </div>
</div>

<!-- INVITE LINK -->
<div id="pg-invite">
  <div class="lbox">
    <div style="text-align:center;margin-bottom:20px">
      <div style="font-size:36px;margin-bottom:10px">🔐</div>
      <div style="font-size:18px;font-weight:900;margin-bottom:6px">Almost there!</div>
      <div style="font-size:13px;color:var(--mut)">Enter your Member Invite Code to link your Google account.</div>
    </div>
    <div id="gu-info" style="background:var(--s2);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px"></div>
    <div style="margin-bottom:14px">
      <label class="lbl">Invite Code</label>
      <input id="ic" type="text" class="inp" placeholder="SIPR26-XX-0000" autocorrect="off" autocapitalize="characters" style="letter-spacing:1px;font-weight:700;text-transform:uppercase"/>
      <div style="font-size:11px;color:var(--mut);margin-top:4px">Get your code from Jahed (Admin)</div>
    </div>
    <button class="btn-p" onclick="linkCode()">Link My Account →</button>
    <button onclick="doLogout()" style="width:100%;background:none;border:none;color:var(--mut);font-size:12px;cursor:pointer;font-family:inherit;margin-top:10px">Sign out</button>
    <div id="ierr" class="err"></div>
  </div>
</div>

<!-- APP -->
<div id="pg-app">
  <div id="overlay" onclick="closeSidebar()"></div>
  <div id="sidebar">
    <div class="nav-logo">
      <div class="logo">S</div>
      <div style="font-size:13px;font-weight:800">SIPR</div>
      <div style="font-size:8px;letter-spacing:2px;color:var(--mut)">INVEST·GROW·PROSPER</div>
    </div>
    <div id="nav-items"></div>
    <div style="margin-top:auto;padding-top:12px;border-top:1px solid var(--bor)">
      <div style="background:var(--s2);border-radius:9px;padding:9px 11px;display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <div id="su-av"></div>
        <div style="flex:1;min-width:0"><div id="su-name" style="font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div><div id="su-role" style="font-size:10px;color:var(--mut)"></div></div>
      </div>
      <button onclick="doLogout()" style="width:100%;padding:8px;background:#1a040688;border:1px solid #78140044;border-radius:8px;color:#ef4444;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit">Sign Out</button>
    </div>
  </div>
  <div id="main">
    <div id="topbar">

function fmt(n){var v=Number(n||0),neg=v<0,abs=Math.round(Math.abs(v)).toString();return (neg?"BDT -":"BDT ")+abs.replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function countUpBalance(){
  var el=document.getElementById("dash-balance");
  if(!el)return;
  var target=Number(el.dataset.val)||0;
  if(target===0){el.textContent=fmt(0);return;}
  var dur=900,start=null;
  function ease(t){return 1-Math.pow(1-t,3);}
  function step(ts){
    if(!start)start=ts;
    var p=Math.min((ts-start)/dur,1);
    el.textContent=fmt(Math.round(ease(p)*target));
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function loadMembers(cb){
  db.collection("members").get().then(function(snap){
    if(snap.empty){S.mems=DEF_MEMS.slice();if(cb)cb();return;}
    var seen={};
    S.mems=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}).filter(function(m){if(!m.email||seen[m.email])return false;seen[m.email]=true;return true;});
    if(cb)cb();
  }).catch(function(){S.mems=DEF_MEMS.slice();if(cb)cb();});
}
function loadTxs(){
  db.collection("transactions").orderBy("date","desc").onSnapshot(function(snap){
    S.txs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    S.txs.forEach(function(t){if((!t.memberUID||t.memberUID.indexOf("SIPR26")<0)&&t.member){var uid=NAME_MAP[t.member.toLowerCase().trim()];if(uid)db.collection("transactions").doc(t.id).update({memberUID:uid}).catch(function(){});}});
    if(["dashboard","payments","transactions","members","expenses","wallet"].indexOf(S.tab)>=0)render();
  });
}

  db.collection("investments").orderBy("date","desc").onSnapshot(function(snap){
    S.invs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    if(S.tab==="dashboard"||S.tab==="investments")render();

}

}

function setManager(invId){
  var inv=S.invs.find(function(x){return x.id===invId;});if(!inv)return;
  var h="<div class='modal-bg' onclick='if(event.target===this)closeModal()'><div class='modal-box'>";
  h+="<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:16px'><div style='font-weight:800;font-size:17px'>Set Project Manager</div><button onclick='closeModal()' style='background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer'>&#x2715;</button></div>";
  h+="<div class='fc'><div><label class='lbl'>Select Manager</label><select id='pm-sel' class='inp'><option value=''>— No Manager (Admin controls) —</option>";
  S.mems.forEach(function(m){h+="<option value='"+m.id+"'"+(inv.projectManagerId===m.id?" selected":"")+">"+m.name+" — "+m.title+"</option>";});
  h+="</select></div><button class='btn-p' onclick='saveManager(this.dataset.id)' data-id='"+invId+"'>Save Manager</button></div></div></div>";
  $("modal").innerHTML=h;
}
function saveManager(invId){
  var pmId=($("pm-sel")||{value:""}).value;
  var pmName=pmId?(S.mems.find(function(m){return m.id===pmId;})||{name:""}).name:"";
  db.collection("investments").doc(invId).update({projectManagerId:pmId,projectManagerName:pmName}).then(function(){closeModal();toast(pmName?"Manager: "+pmName:"Manager removed");}).catch(function(e){toast(e.message,false);});
}
function addTeamMember(invId){
  var inv=S.invs.find(function(x){return x.id===invId;});if(!inv)return;
  var existIds=(inv.teamEntries||[]).filter(function(t){return t.memberId;}).map(function(t){return t.memberId;});
  var h="<div class='modal-bg' onclick='if(event.target===this)closeModal()'><div class='modal-box'>";
  h+="<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:16px'><div style='font-weight:800;font-size:17px'>Add Team Member</div><button onclick='closeModal()' style='background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer'>&#x2715;</button></div>";
  h+="<div class='fc'><div><label class='lbl'>SIPR Member or External</label><select id='tm-sel' class='inp'>";
  h+="<option value='external'>+ Add External Person</option>";
  S.mems.forEach(function(m){if(existIds.indexOf(m.id)<0)h+="<option value='"+m.id+"'>"+m.name+" — "+m.title+"</option>";});
  h+="</select></div>";
  h+="<div><label class='lbl'>External Name (if not SIPR member)</label><input id='tm-extname' type='text' class='inp' placeholder='Full name of external person'/></div>";
  h+="<div><label class='lbl'>Role in Project</label><input id='tm-role' type='text' class='inp' placeholder='Manager, Driver, Field Worker, Accountant...'/></div>";
  h+="<button class='btn-p' onclick='saveTeamMember(this.dataset.id)' data-id='"+invId+"'>Add to Team</button></div></div></div>";
  $("modal").innerHTML=h;
}
function saveTeamMember(invId){
  var sel=($("tm-sel")||{value:"external"}).value;
  var role=($("tm-role")||{value:""}).value.trim();
  var inv=S.invs.find(function(x){return x.id===invId;});if(!inv)return;
  var entry;
  if(sel==="external"){
    var nm=($("tm-extname")||{value:""}).value.trim();
    if(!nm){toast("Enter external person name",false);return;}
    entry={name:nm,role:role,isExternal:true};
  } else {
    var mem=S.mems.find(function(m){return m.id===sel;});
    if(!mem){toast("Select a member",false);return;}
    entry={memberId:mem.id,name:mem.name,role:role,isExternal:false};
  }
  var team=(inv.teamEntries||[]).slice();team.push(entry);
  db.collection("investments").doc(invId).update({teamEntries:team}).then(function(){closeModal();toast(entry.name+" added!");}).catch(function(e){toast(e.message,false);});
}
function removeTeamMember(invId,idx){
  if(!confirm("Remove this team member?"))return;
  var inv=S.invs.find(function(x){return x.id===invId;});if(!inv)return;
  var team=(inv.teamEntries||[]).slice();team.splice(Number(idx),1);
  db.collection("investments").doc(invId).update({teamEntries:team}).then(function(){toast("Removed from team.");}).catch(function(e){toast(e.message,false);});
}
