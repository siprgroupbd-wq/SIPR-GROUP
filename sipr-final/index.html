<html lang="en">
<head>

<title>SIPR Group</title>

<style>
:root{
  --bg:#050709;--sur:#0b0d14;--s2:#0f1219;--s3:#141720;
  --bor:#181c28;--bor2:#1e2235;--txt:#e8eaf2;--mut:#434966;--mut2:#636b88;
  --grn:#3b82f6;--grn2:#1d4ed8;--gdm:#060e1c;--gbr:#0c1e40;
  --gold:#f59e0b;--purple:#8b5cf6;--red:#ef4444;--teal:#06b6d4;
  --green:#10b981;--orange:#f97316;
  --sh:0 4px 24px #00000060;--sh2:0 8px 40px #00000080;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
#pg-login{min-height:100vh;align-items:center;justify-content:center;background:radial-gradient(ellipse at 20% 20%,#091525,var(--bg) 65%);display:flex;}
.lbox{background:var(--sur);border:1px solid var(--bor2);border-radius:24px;padding:40px 36px;width:100%;max-width:400px;box-shadow:var(--sh2);}
.lbl{display:block;font-size:10px;letter-spacing:2.5px;color:var(--mut2);font-weight:700;margin-bottom:7px;text-transform:uppercase;}
.inp{width:100%;background:var(--s2);border:1px solid var(--bor);border-radius:12px;padding:12px 14px;color:var(--txt);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s;}
.inp:focus{border-color:var(--grn);box-shadow:0 0 0 3px #3b82f614;}
select.inp{cursor:pointer;}textarea.inp{resize:vertical;}
.btn-p{width:100%;padding:14px;background:linear-gradient(135deg,var(--grn2),var(--grn));color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation;box-shadow:0 4px 16px #3b82f630;}
.btn-g{width:100%;padding:13px;background:var(--s2);border:1px solid var(--bor2);color:var(--txt);border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;touch-action:manipulation;}
.btn-a{background:var(--gdm);color:var(--grn);border:1px solid var(--gbr);border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.btn-s{background:var(--s2);color:var(--txt);border:1px solid var(--bor);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.btn-d{background:#1a040699;color:#ef4444;border:1px solid #7f1d1d55;border-radius:9px;padding:7px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.btn-wa{background:#071a0f;color:#25d366;border:1px solid #25d36633;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;touch-action:manipulation;}
.divider{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:11px;margin:16px 0;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--bor);}
.err{color:#f87171;font-size:12px;padding:11px 14px;background:#1a060699;border-radius:10px;border:1px solid #7f1d1d;margin-top:10px;display:none;}
#pg-app{display:none;min-height:100vh;}
#sidebar{width:230px;background:var(--sur);border-right:1px solid var(--bor);display:flex;flex-direction:column;padding:18px 12px;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:100;transition:transform .25s;}
.nav-logo{text-align:center;padding:6px 0 18px;border-bottom:1px solid var(--bor);margin-bottom:14px;}
.nav-logo .logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--gbr),var(--grn));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;margin:0 auto 9px;box-shadow:0 4px 20px #3b82f640;}
.nav-logo .logo-name{font-size:15px;font-weight:900;letter-spacing:.5px;}
.nav-logo .logo-sub{font-size:8px;letter-spacing:3.5px;color:var(--mut);margin-top:2px;text-transform:uppercase;}
.nav-section{font-size:9px;letter-spacing:2.5px;color:var(--mut);font-weight:700;padding:8px 10px 4px;text-transform:uppercase;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mut2);margin-bottom:2px;transition:all .15s;touch-action:manipulation;}
.nav-item:hover{background:var(--s2);color:var(--txt);}
.nav-item.active{background:linear-gradient(135deg,var(--gdm),#091828);color:var(--grn);border:1px solid var(--gbr);}
.nav-item .nav-ic{width:20px;text-align:center;font-size:16px;}
#main{margin-left:230px;flex:1;padding:26px 30px;max-width:980px;}
#topbar{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
#topbar h2{font-size:21px;font-weight:900;flex:1;letter-spacing:-.5px;}
#ham{display:none;background:var(--s2);border:1px solid var(--bor);border-radius:10px;padding:9px 12px;font-size:18px;cursor:pointer;color:var(--txt);touch-action:manipulation;}
@media(max-width:800px){
  #sidebar{transform:translateX(-230px);}
  #sidebar.open{transform:translateX(0);box-shadow:12px 0 48px #00000099;}
  #main{margin-left:0;padding:14px 14px 90px;}
  #ham{display:block;}
  #bot-nav{display:flex!important;}
  .hide-mob{display:none!important;}
}
#bot-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--sur);border-top:1px solid var(--bor);z-index:100;padding:6px 4px 8px;box-shadow:0 -4px 24px #00000060;}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;cursor:pointer;color:var(--mut);font-size:9px;font-weight:700;border:none;background:none;font-family:inherit;touch-action:manipulation;border-radius:8px;}
.bn.active{color:var(--grn);}
.bn .bi{font-size:20px;line-height:1;}
#overlay{display:none;position:fixed;inset:0;background:#00000088;z-index:99;}
.card{background:var(--sur);border:1px solid var(--bor);border-radius:18px;padding:22px;}
.sc{background:var(--s2);border:1px solid var(--bor);border-radius:14px;padding:15px;}
.hero{background:linear-gradient(140deg,var(--gdm) 0%,#080f1e 100%);border:1px solid var(--gbr);border-radius:20px;padding:26px 30px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,#3b82f60a,transparent 70%);border-radius:50%;pointer-events:none;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media(max-width:600px){.g4{grid-template-columns:1fr 1fr;}.g3{grid-template-columns:1fr 1fr;}.g2-mob{grid-template-columns:1fr!important;}}
.fc{display:flex;flex-direction:column;gap:16px;}
.tab-row{display:flex;gap:6px;flex-wrap:wrap;}
.tab{background:var(--s2);border:1px solid var(--bor);border-radius:9px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;color:var(--mut2);font-family:inherit;touch-action:manipulation;}
.tab.active{background:var(--gdm);border-color:var(--gbr);color:var(--grn);}
.bdg{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.3px;}
.pbar{height:4px;background:var(--s2);border-radius:99px;overflow:hidden;}
.pfill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--grn2),var(--grn));}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:10px 13px;text-align:left;font-size:9px;letter-spacing:2px;color:var(--mut2);font-weight:700;border-bottom:1px solid var(--bor);text-transform:uppercase;}
.tbl td{padding:12px 13px;border-bottom:1px solid var(--bor);font-size:13px;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr:hover{background:var(--s2);}
.sw{overflow-x:auto;}
.modal-bg{position:fixed;inset:0;background:#00000094;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal-box{background:var(--sur);border:1px solid var(--bor2);border-radius:22px;padding:28px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh2);}
#prof-btn{position:relative;cursor:pointer;touch-action:manipulation;}
#prof-drop{display:none;position:absolute;top:52px;right:0;background:var(--sur);border:1px solid var(--bor2);border-radius:18px;padding:12px;min-width:220px;z-index:200;box-shadow:var(--sh2);}
#toast{display:none;position:fixed;bottom:90px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:14px;font-size:13px;font-weight:700;z-index:9999;white-space:nowrap;box-shadow:var(--sh2);}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;margin-right:6px;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
.pb-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--bor);}
.pb-row:last-child{border-bottom:none;}
.col-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bor);}
.col-row:last-child{border-bottom:none;}
.stat-box{background:var(--s2);border:1px solid var(--bor);border-radius:14px;padding:15px;text-align:center;}
.stat-box .val{font-size:17px;font-weight:900;margin-top:5px;letter-spacing:-.5px;}
.stat-box .lbl2{font-size:9px;color:var(--mut2);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
#pg-invite{display:none;min-height:100vh;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 20%,#0d1f4a,var(--bg));}
input[type=checkbox].tog{width:40px;height:22px;appearance:none;-webkit-appearance:none;background:var(--bor2);border-radius:99px;cursor:pointer;transition:background .2s;position:relative;flex-shrink:0;border:none;outline:none;}
input[type=checkbox].tog:checked{background:var(--grn);}
input[type=checkbox].tog::after{content:'';width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .18s;box-shadow:0 1px 4px #00000040;}
input[type=checkbox].tog:checked::after{left:21px;}
.perm-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bor);}
.perm-row:last-child{border-bottom:none;}
.prio-high{color:#ef4444;background:#1a040499;border:1px solid #7f1d1d44;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;}
.prio-med{color:#f59e0b;background:#1c0e0099;border:1px solid #78350f44;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;}
.prio-low{color:#3b82f6;background:#06102099;border:1px solid #1e3a5f44;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;}
.task-row{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--bor);}
.task-row:last-child{border-bottom:none;}
.rem-card{background:var(--s2);border:1px solid var(--bor);border-radius:14px;padding:13px 15px;display:flex;align-items:center;gap:12px;}
/* PROJECT SYSTEM */
.proj-card{background:var(--sur);border:1px solid var(--bor);border-radius:18px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .15s,box-shadow .2s;}
.proj-card:hover{border-color:var(--bor2);transform:translateY(-2px);box-shadow:0 8px 32px #00000050;}
.proj-tab-bar{display:flex;gap:0;overflow-x:auto;border-bottom:1px solid var(--bor);scrollbar-width:none;}
.proj-tab-bar::-webkit-scrollbar{display:none;}
.proj-tab{padding:14px 20px;border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--mut2);border-bottom:2px solid transparent;touch-action:manipulation;white-space:nowrap;flex-shrink:0;transition:color .15s;}
.proj-tab.active{color:var(--grn);border-bottom-color:var(--grn);}
.proj-page{background:var(--sur);border:1px solid var(--bor);border-radius:20px;overflow:hidden;}
</style>
</head>

// ═══════════ HELPERS ═══════════
function $(i){return document.getElementById(i);}
function mob(){return window.innerWidth<800;}
function fmt(n){return"BDT "+(Number(n||0)).toLocaleString("en-BD");}
function fd(d){if(!d)return"—";try{return new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});}catch(e){return"—";}}
function now(){return new Date().toISOString();}
function sumT(arr,t){return arr.filter(function(x){return x.type===t;}).reduce(function(s,x){return s+Number(x.amount);},0);}
function pct(v,mx){return Math.min(Math.round(v/mx*100),100);}
function av(name,sz){
  sz=sz||36;
  var h=(name||"?").split("").reduce(function(a,c){return a+c.charCodeAt(0);},0)%360;
  var ini=(name||"?").split(" ").map(function(w){return w[0]||"";}).join("").slice(0,2).toUpperCase();
  return "<div style='width:"+sz+"px;height:"+sz+"px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,hsl("+h+",40%,20%),hsl("+((h+50)%360)+",50%,30%));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:"+Math.round(sz*.35)+"px'>"+ini+"</div>";
}
function txbdg(t){var c=TC[t]||TC.deposit;return "<span class='bdg' style='background:"+c.B+";color:"+c.C+";border:1px solid "+c.BD+"'>"+c.I+" "+c.L+"</span>";}
var _tt;
function toast(m,ok){ok=ok!==false;var t=$("toast");t.style.background=ok?"linear-gradient(135deg,#0a1226,#0d1f4a)":"linear-gradient(135deg,#1a0404,#2a0808)";t.style.border="1px solid "+(ok?"var(--grn)":"#ef4444");t.style.color=ok?"var(--grn)":"#f87171";t.textContent=(ok?"✓ ":"✗ ")+m;t.style.display="block";clearTimeout(_tt);_tt=setTimeout(function(){t.style.display="none";},3500);}
function getMem(email){return S.mems.find(function(m){return m.email===email;})||{};}
function resolveUID(t){if(t.memberUID&&t.memberUID.indexOf("SIPR26")===0)return t.memberUID;if(t.memberEmail){var mx=S.mems.find(function(x){return x.email===t.memberEmail;});if(mx)return mx.id;}if(t.member){var u=NAME_MAP[t.member.toLowerCase().trim()];if(u)return u;}return null;}
function txName(t){var u=resolveUID(t);if(u){var m=S.mems.find(function(x){return x.id===u;});if(m)return m.name;}return t.member||"Unknown";}
function txMatch(t,mem){var u=resolveUID(t);if(u)return u===mem.id;return t.member===mem.name;}
// Permission helpers
function hasPerm(perm){
  if(S.role==="admin")return true;
  var me=getMem(S.email);var perms=me.permissions||{};
  if(perm==="addTransaction"&&S.role==="finance")return true;
  if((perm==="sendNotices"||perm==="uploadDocuments")&&S.role==="secretary")return true;
  if(perm==="sendPaymentReminder"&&S.role==="finance")return true;
  return!!perms[perm];
}
function isAdmin(){return S.role==="admin";}
function canWrite(){return hasPerm("addTransaction");}
function canAnnounce(){return hasPerm("sendNotices");}
function canUploadDoc(){return hasPerm("uploadDocuments");}
function canRemind(){return S.role==="admin"||hasPerm("sendPaymentReminder");}
function canManageProj(){return S.role==="admin"||S.role==="finance"||hasPerm("manageProjects");}

function gLogin(){fa.signInWithPopup(gp).catch(function(e){showErr("lerr",e.message);});}
function eLogin(){
  var em=($("em")||{value:""}).value.trim().toLowerCase();
  var pw=($("pw")||{value:""}).value;
  if(!em||!pw){showErr("lerr","Enter email and password.");return;}
  hideErr("lerr");
  fa.signInWithEmailAndPassword(em,pw).catch(function(e){
    showErr("lerr",e.code==="auth/user-not-found"?"Email not found.":e.code==="auth/wrong-password"||e.code==="auth/invalid-credential"?"Wrong password.":e.message);
  });
}
function fPass(){var em=($("em")||{value:""}).value.trim();if(!em){showErr("lerr","Enter your email first.");return;}fa.sendPasswordResetEmail(em).then(function(){toast("Reset email sent!");}).catch(function(e){showErr("lerr",e.message);});}
function showReg(){$("lf").style.display="none";$("rf").style.display="block";hideErr("lerr");}
function showLogin(){$("lf").style.display="block";$("rf").style.display="none";hideErr("lerr");}
function doReg(){
  var name=($("rn")||{value:""}).value.trim();
  var email=($("re")||{value:""}).value.trim().toLowerCase();
  var pass=($("rp")||{value:""}).value;
  var code=($("rc")||{value:""}).value.trim().toUpperCase();
  if(!name||!email||!pass||!code){showErr("lerr","All fields required.");return;}
  if(pass.length<6){showErr("lerr","Password min 6 characters.");return;}
  var mem=S.mems.find(function(m){return m.id.toUpperCase()===code;});
  if(!mem){showErr("lerr","Invalid invite code. Ask Jahed.");return;}
  fa.createUserWithEmailAndPassword(email,pass).then(function(cred){
    return db.collection("members").doc(mem.id).update({email:email,name:name,authUid:cred.user.uid,status:"pending",_registered:true,pendingAt:now()});
  }).then(function(){
    db.collection("pendingApprovals").add({memberId:mem.id,name:name,email:email,requestedAt:now(),status:"pending"}).catch(function(){});
    showLogin();hideErr("lerr");toast("Registration submitted! Wait for admin approval.");
  }).catch(function(e){showErr("lerr",e.message);});
}
function linkCode(){
  var code=($("ic")||{value:""}).value.trim().toUpperCase();
  if(!code){showErr("ierr","Enter your invite code.");return;}
  var user=fa.currentUser;if(!user){showErr("ierr","Not signed in.");return;}
  var mem=S.mems.find(function(m){return m.id.toUpperCase()===code;});
  if(!mem){showErr("ierr","Invalid code. Ask Jahed.");return;}
  // Allow re-linking if the same user tries again
  if(mem.googleUid&&mem.googleUid!==user.uid){showErr("ierr","This code is already linked to another account.");return;}
  db.collection("members").doc(mem.id).update({googleUid:user.uid,googleEmail:user.email,_registered:true}).then(function(){
    Object.assign(mem,{googleUid:user.uid,googleEmail:user.email});
    S.email=mem.email;S.name=mem.name||user.displayName;S.uid=user.uid;S.role=mem.role||"member";
    $("pg-invite").style.display="none";
    initApp();toast("Welcome to SIPR, "+S.name+"! 🎉");
  }).catch(function(e){showErr("ierr","Error: "+e.message);});
}

fa.onAuthStateChanged(function(user){
  if(!user){$("pg-app").style.display="none";$("pg-login").style.display="flex";$("pg-invite").style.display="none";return;}
  loadMembers(function(){
    var mem=S.mems.find(function(m){return m.googleUid===user.uid;})||S.mems.find(function(m){return m.email===user.email;});
    if(mem){
      if(mem.status==="pending"){$("pg-login").style.display="flex";showErr("lerr","Your registration is pending admin approval.");fa.signOut();return;}
      S.email=mem.email;S.name=mem.name||user.displayName||user.email;S.uid=user.uid;S.role=mem.role||"member";
      $("pg-login").style.display="none";$("pg-invite").style.display="none";
      initApp();
    } else {
      $("pg-login").style.display="none";
      var ip=$("pg-invite");ip.style.display="flex";
      var gi=$("gu-info");
      if(gi)gi.innerHTML=av(user.displayName||user.email,32)+"<div><div style='font-size:13px;font-weight:700'>"+(user.displayName||"New User")+"</div><div style='font-size:11px;color:var(--mut)'>"+user.email+"</div></div>";
    }
  });
});

// ═══════════ DATA ═══════════
function loadMembers(cb){
  db.collection("members").get().then(function(snap){
    if(snap.empty){S.mems=DEF_MEMS.slice();if(cb)cb();return;}
    var seen={};
    S.mems=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}).filter(function(m){if(!m.email||seen[m.email])return false;seen[m.email]=true;return true;});
    if(cb)cb();
  }).catch(function(){S.mems=DEF_MEMS.slice();if(cb)cb();});
}
function loadTxs(){
  db.collection("transactions").orderBy("date","desc").onSnapshot(function(snap){
    S.txs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    S.txs.forEach(function(t){if((!t.memberUID||t.memberUID.indexOf("SIPR26")<0)&&t.member){var uid=NAME_MAP[t.member.toLowerCase().trim()];if(uid)db.collection("transactions").doc(t.id).update({memberUID:uid}).catch(function(){});}});
    if(["dashboard","payments","transactions","members","expenses","wallet"].indexOf(S.tab)>=0)render();
  });
}
function loadInvs(){
  db.collection("investments").orderBy("date","desc").onSnapshot(function(snap){
    S.invs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    if(S.tab==="dashboard"||S.tab==="investments")render();
  });
}
function loadWallets(){
  db.collection("wallets").onSnapshot(function(snap){
    S.wallets=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
    updateWallet();
    if(S.tab==="wallet")render();
  });
}
function logAct(action,detail){
  var imp=["add_transaction","edit_transaction","delete_transaction","add_investment","edit_investment","delete_investment","post_announcement","submit_proposal","distribute_profit","issue_fine","save_member","change_role","reset_members","add_member","remove_member","add_collection","add_sale"];
  if(imp.indexOf(action)<0||!S.name)return;
  db.collection("activity").add({action:action,detail:detail,by:S.name,byEmail:S.email,role:S.role,ts:firebase.firestore.FieldValue.serverTimestamp(),iso:now()}).catch(function(){});
}

}

  var ni=$("nav-items"),bn=$("bot-nav");if(!ni||!bn)return;
  var vis=NAVS.filter(function(n){
    if(n.adm&&!isAdmin())return false;
    if(n.perm==="remind"&&!canRemind())return false;
    return true;
  });
  ni.innerHTML=vis.map(function(n){return "<div class='nav-item"+(S.tab===n.id?" active":"")+"' onclick='goPage(\""+n.id+"\");closeSidebar()'><span style='width:18px;text-align:center'>"+n.ic+"</span><span>"+n.lb+"</span></div>";}).join("");
  var pri=["dashboard","payments","investments","transactions","members"];
  bn.innerHTML=pri.map(function(id){var n=vis.find(function(x){return x.id===id;});if(!n)return"";return"<button class='bn"+(S.tab===id?" active":"")+"' onclick='goPage(\""+id+"\")'><span class='bi'>"+n.ic+"</span>"+n.lb.split(" ")[0]+"</button>";}).join("")+"<button class='bn' onclick='moreMenu()'><span class='bi'>☰</span>MORE</button>";

function getMemWallet(mid){var w=S.wallets.find(function(x){return x.memberId===mid;})||{available:0,locked:0};return{available:Number(w.available||0),locked:Number(w.locked||0)};}

function calcRevenue(){

}
function saveCollection(invId){
  var dt=($("cl-dt")||{value:""}).value;var kg=($("cl-kg")||{value:""}).value;
  if(!dt||!kg){toast("Date and collected kg required",false);return;}
  var entry={date:dt,source:($("cl-src")||{value:""}).value.trim(),kg:Number(kg),plasticType:($("cl-tp")||{value:""}).value.trim(),soldKg:Number(($("cl-sk")||{value:0}).value)||0,pricePerKg:Number(($("cl-pp")||{value:0}).value)||0,revenue:Number(($("cl-rv")||{value:0}).value)||0,saleNote:($("cl-sn")||{value:""}).value.trim(),note:($("cl-nt")||{value:""}).value.trim(),addedBy:S.name,addedAt:now()};
  var inv=S.invs.find(function(x){return x.id===invId;});if(!inv)return;
  var cols2=(inv.collections||[]).slice();cols2.push(entry);
  // Also update actual return if revenue added
  var newReturn=Number(inv.actualReturn||0)+entry.revenue;
  db.collection("investments").doc(invId).update({collections:cols2,actualReturn:newReturn}).then(function(){closeModal();logAct("add_collection",entry.kg+"kg from "+entry.source+" — "+inv.name);toast("Collection entry added!");}).catch(function(e){toast(e.message,false);});
}
function delCollection(invId,idx){
  if(!confirm("Delete this entry?"))return;
  var inv=S.invs.find(function(x){return x.id===invId;});if(!inv)return;
  var cols2=(inv.collections||[]).slice();
  var rev=Number(cols2[idx].revenue||0);

  db.collection("investments").doc(invId).update({collections:cols2,actualReturn:newReturn}).then(function(){toast("Entry deleted.");}).catch(function(e){toast(e.message,false);});
}

function saveTask(invId,idx){

function openPhotoUpload(mid){
  var h="<div class='modal-bg' onclick='if(event.target===this)closeModal()'><div class='modal-box'>";
  h+="<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:18px'><div style='font-weight:800;font-size:17px'>📷 Profile Photo</div><button onclick='closeModal()' style='background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer'>✕</button></div>";
  h+="<div class='fc'>";
  h+="<div style='font-size:12px;color:var(--mut);background:var(--s2);border-radius:9px;padding:10px'>Max size: <strong>200KB</strong>. JPG or PNG recommended.</div>";
  h+="<input type='file' id='ph-file' accept='image/*' class='inp' style='padding:8px' onchange='previewPhoto()'/>";
  h+="<div id='ph-preview' style='display:none;text-align:center;padding:10px'><img id='ph-img' style='width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid var(--gbr)'/><div style='font-size:11px;color:var(--grn);margin-top:6px;font-weight:600'>Preview</div></div>";
  h+="<button class='btn-p' onclick='savePhoto(\""+mid+"\")'>💾 Save Photo</button>";
  h+="</div></div></div>";
  $("modal").innerHTML=h;
}
function previewPhoto(){
  var f=($("ph-file")||{files:[]}).files[0];
  if(!f)return;
  if(f.size>200000){toast("Photo too large. Max 200KB.",false);return;}
  var r=new FileReader();
  r.onload=function(){
    var img=$("ph-img"),prev=$("ph-preview");
    if(img)img.src=r.result;
    if(prev)prev.style.display="block";
  };
  r.readAsDataURL(f);
}
function savePhoto(mid){
  var f=($("ph-file")||{files:[]}).files[0];
  if(!f){toast("Please choose a photo first",false);return;}
  if(f.size>200000){toast("Photo too large. Max 200KB.",false);return;}
  var r=new FileReader();
  r.onload=function(){
    db.collection("members").doc(mid).update({photo:r.result}).then(function(){
      var mem=S.mems.find(function(x){return x.id===mid;});
      if(mem)mem.photo=r.result;
      closeModal();render();toast("Photo saved!");
    }).catch(function(e){toast(e.message,false);});
  };
  r.readAsDataURL(f);
}

function pExpenses(){var exps=S.txs.filter(function(t){return t.type==="expense";}),total=exps.reduce(function(s,t){return s+Number(t.amount);},0);var h="<div class='fc'><div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px'><h2 style='font-size:22px;font-weight:800'>Expenses</h2>"+(canWrite()?"<button class='btn-a' onclick='openTx(null,\"expense\")'>+ Log Expense</button>":"")+"</div><div class='g3'><div class='sc' style='background:#1a040488;text-align:center'><div class='lbl2' style='margin-bottom:5px'>TOTAL</div><div style='color:var(--red);font-weight:900;font-size:17px'>"+fmt(total)+"</div></div><div class='sc' style='text-align:center'><div class='lbl2' style='margin-bottom:5px'>RECORDS</div><div style='font-weight:900;font-size:17px'>"+exps.length+"</div></div><div class='sc' style='text-align:center'><div class='lbl2' style='margin-bottom:5px'>AVG</div><div style='color:var(--gold);font-weight:900;font-size:17px'>"+(exps.length?fmt(Math.round(total/exps.length)):fmt(0))+"</div></div></div>";if(!exps.length)h+="<div class='card' style='text-align:center;padding:48px;color:var(--mut)'><div style='font-size:40px;opacity:.3;margin-bottom:12px'>💸</div>No expenses yet.</div>";else{h+="<div class='card' style='padding:0;overflow:hidden'><div class='sw'><table class='tbl'><thead><tr><th>#</th><th>Date</th><th>Amount</th><th>By</th><th>Description</th><th></th></tr></thead><tbody>";exps.forEach(function(t,i){h+="<tr><td style='color:var(--mut);font-size:11px'>"+(i+1)+"</td><td style='color:var(--mut);white-space:nowrap'>"+fd(t.date)+"</td><td style='color:var(--red);font-weight:700'>-"+fmt(t.amount)+"</td><td style='font-weight:600'>"+txName(t)+"</td><td style='color:var(--mut);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'>"+(t.note||"—")+"</td><td>"+(canWrite()?"<div style='display:flex;gap:4px'><button class='btn-s' onclick='openTx(\""+t.id+"\",null)' style='padding:4px 8px'>Edit</button>"+(isAdmin()?"<button class='btn-d' onclick='delTx(\""+t.id+"\")' style='padding:4px 8px'>Del</button>":"")+"</div>":"")+"</td></tr>";});h+="</tbody></table></div></div>";}h+="</div>";return h;}

// ═══════════ DOCUMENTS ═══════════
function pDocs(){return"<div class='fc'><div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px'><h2 style='font-size:22px;font-weight:800'>Documents</h2>"+(canUploadDoc()?"<button class='btn-a' onclick='openDocForm()'>+ Add Document</button>":"")+"</div><div id='doc-list'><div style='text-align:center;padding:36px;color:var(--mut)'>Loading...</div></div></div>";}
function loadDocs(){db.collection("documents").orderBy("createdAt","desc").get().then(function(snap){var docs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});var el=$("doc-list");if(!el)return;if(!docs.length){el.innerHTML="<div class='card' style='text-align:center;padding:40px;color:var(--mut)'>No documents yet.</div>";return;}el.innerHTML="<div style='display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px'>"+docs.map(function(d){return"<div class='card' style='padding:13px'>"+(d.imageData?"<div style='height:80px;border-radius:7px;overflow:hidden;margin-bottom:9px'><img src='"+d.imageData+"' style='width:100%;height:100%;object-fit:cover'/></div>":"<div style='height:44px;border-radius:7px;background:var(--s2);display:flex;align-items:center;justify-content:center;margin-bottom:9px;font-size:22px;color:var(--mut)'>📄</div>")+"<div style='font-weight:700;font-size:13px;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap'>"+d.name+"</div><div style='font-size:11px;color:var(--mut);margin-bottom:6px'>"+d.category+"</div>"+(d.url?"<a href='"+d.url+"' target='_blank' style='font-size:11px;color:var(--grn);text-decoration:none'>🔗 Open</a>":"")+(canUploadDoc()?"<button onclick='delDoc(\""+d.id+"\")' class='btn-d' style='width:100%;margin-top:7px;padding:4px;font-size:11px'>Delete</button>":"")+"</div>";}).join("")+"</div>";});}
function openDocForm(){$("modal").innerHTML="<div class='modal-bg' onclick='if(event.target===this)closeModal()'><div class='modal-box'><div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:18px'><div style='font-weight:800;font-size:17px'>Add Document</div><button onclick='closeModal()' style='background:none;border:none;color:var(--mut);font-size:20px;cursor:pointer'>✕</button></div><div class='fc'><div><label class='lbl'>Name *</label><input id='dc-n' type='text' class='inp'/></div><div><label class='lbl'>Category</label><select id='dc-c' class='inp'><option>Meeting Notes</option><option>Financial Report</option><option>Legal</option><option>Research</option><option>Photo</option><option>Other</option></select></div><div><label class='lbl'>URL (optional)</label><input id='dc-u' type='url' class='inp' placeholder='https://...'/></div><div><label class='lbl'>Image (max 500KB)</label><input id='dc-f' type='file' accept='image/*' class='inp' style='padding:8px'/></div><button class='btn-p' onclick='saveDoc()'>Save Document</button></div></div></div>";}
function saveDoc(){var nm=($("dc-n")||{value:""}).value.trim();if(!nm){toast("Name required",false);return;}var fl=($("dc-f")||{files:[]}).files[0];var sv=function(img){db.collection("documents").add({name:nm,category:($("dc-c")||{value:"Other"}).value,url:($("dc-u")||{value:""}).value.trim(),imageData:img||"",addedBy:S.name,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){closeModal();loadDocs();toast("Added!");}).catch(function(e){toast(e.message,false);});};if(fl){if(fl.size>500000){toast("Max 500KB",false);return;}var r=new FileReader();r.onload=function(){sv(r.result);};r.readAsDataURL(fl);}else sv("");}
function delDoc(id){if(!confirm("Delete?"))return;db.collection("documents").doc(id).delete().then(function(){loadDocs();toast("Deleted.");}).catch(function(e){toast(e.message,false);});}

// ═══════════ ACTIVITY ═══════════
function pActivity(){return"<div class='fc'><div><h2 style='font-size:22px;font-weight:800'>Activity Log</h2><p style='font-size:13px;color:var(--mut);margin-top:4px'>Important actions only.</p></div><div id='act-list'><div style='text-align:center;padding:36px;color:var(--mut)'>Loading...</div></div></div>";}
function loadActivity(){db.collection("activity").orderBy("ts","desc").limit(80).get().then(function(snap){var el=$("act-list");if(!el)return;if(snap.empty){el.innerHTML="<div class='card' style='text-align:center;padding:40px;color:var(--mut)'>No activity yet.</div>";return;}var acts=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});var groups={},order=[];acts.forEach(function(a){var d=a.iso?a.iso.split("T")[0]:"Unknown";if(!groups[d]){groups[d]=[];order.push(d);}groups[d].push(a);});var icons={add_transaction:"💸",edit_transaction:"✏️",delete_transaction:"🗑",add_investment:"📈",edit_investment:"✏️",delete_investment:"🗑",post_announcement:"📢",submit_proposal:"📋",distribute_profit:"💰",issue_fine:"⚠",save_member:"💾",change_role:"🔄",reset_members:"♻️",add_member:"➕",remove_member:"➖",add_collection:"📦",add_sale:"💵"};var h="";order.forEach(function(date){h+="<div style='font-size:10px;letter-spacing:2px;color:var(--mut);font-weight:700;padding:7px 0;margin-bottom:3px'>"+fd(date)+"</div><div class='card' style='padding:0;overflow:hidden;margin-bottom:10px'>";groups[date].forEach(function(a,i){var ic=icons[a.action]||"📌";h+="<div style='display:flex;align-items:center;gap:10px;padding:10px 13px;"+(i>0?"border-top:1px solid var(--bor)":"")+"'><div style='width:30px;height:30px;border-radius:9px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0'>"+ic+"</div><div style='flex:1;min-width:0'><div style='font-size:13px;font-weight:600'>"+a.action.replace(/_/g," ")+"</div><div style='font-size:11px;color:var(--mut)'>"+(a.detail||"")+"</div></div><div style='text-align:right;flex-shrink:0'><div style='font-size:12px;font-weight:600'>"+a.by+"</div><div style='font-size:10px;color:var(--mut)'>"+(a.iso?a.iso.split("T")[1].slice(0,5):"")+"</div></div></div>";});h+="</div>";});el.innerHTML=h;});}

// ═══════════ ABOUT ═══════════
function pAbout(){var h="<div class='fc'><div class='hero' style='text-align:center'><div style='font-size:10px;letter-spacing:3px;color:var(--mut);font-weight:700;margin-bottom:14px'>SIPR GROUP</div><div style='font-size:32px;font-weight:900;letter-spacing:-1px;margin-bottom:7px'>Invest. Grow. Prosper.</div><div style='color:var(--mut);font-size:13px'>Founded February 2026 · Boalkhali, Chittagong · "+S.mems.length+" Members</div></div><div class='g2 g2-mob' style='gap:12px'><div class='card'><div style='color:var(--grn);font-size:10px;letter-spacing:2px;font-weight:700;margin-bottom:9px'>MISSION</div><div style='color:var(--mut);font-size:13px;line-height:1.8'>Build a self-sustaining investment group where every member saves, invests, and grows wealth through collective action.</div></div><div class='card'><div style='color:var(--gold);font-size:10px;letter-spacing:2px;font-weight:700;margin-bottom:9px'>VISION</div><div style='color:var(--mut);font-size:13px;line-height:1.8'>Become a formal business within 12 months operating a profitable plastic recycling business along the Karnafuli River.</div></div></div><div class='card'><div style='font-size:11px;letter-spacing:2px;color:var(--mut);font-weight:700;margin-bottom:14px'>FOUNDING MEMBERS</div><div style='display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px'>"+S.mems.map(function(m){var rc={admin:"var(--red)",finance:"var(--gold)",secretary:"var(--teal)",member:"var(--mut)"}[m.role||"member"]||"var(--mut)";return"<div style='background:var(--s2);border-radius:11px;padding:12px;text-align:center;border:1px solid var(--bor)'><div style='display:flex;justify-content:center;margin-bottom:7px'>"+avM(m,38)+"</div><div style='font-weight:700;font-size:12px'>"+m.name+"</div><div style='font-size:10px;color:"+rc+";margin-top:2px;font-weight:600'>"+m.title+"</div></div>";}).join("")+"</div></div></div>";return h;}

// ═══════════ CONTROL PANEL ═══════════
function pControl(){
  var RC={admin:{L:"Admin (Full Access)",C:"var(--red)"},finance:{L:"Finance (Transactions)",C:"var(--gold)"},secretary:{L:"Secretary (Announcements & Docs)",C:"var(--teal)"},member:{L:"Member (Read Only)",C:"var(--mut)"}};
  var PERMS=[
    {key:"sendPaymentReminder",label:"Send Payment Reminders",desc:"Can access Reminder Center and send WhatsApp reminders to unpaid members"},
    {key:"sendNotices",label:"Post Announcements",desc:"Can post announcements on the Notice Board"},
    {key:"uploadDocuments",label:"Upload Documents",desc:"Can add and delete files in the Documents section"},
    {key:"addTransaction",label:"Add Transactions",desc:"Can add, edit payment records and expenses"},
    {key:"manageProjects",label:"Manage Projects",desc:"Can add collection entries and task updates to projects"}
  ];
  var h="<div class='fc'><div><h2 style='font-size:22px;font-weight:800'>⚙ Control Panel</h2><p style='font-size:13px;color:var(--mut);margin-top:3px'>Manage members, photos, roles & granular permissions.</p></div>";
  h+="<div id='ctrl-pending'></div>";
  // Role reference
  h+="<div class='card'><div style='font-size:11px;letter-spacing:2px;color:var(--mut);font-weight:700;margin-bottom:12px'>🔒 BASE ROLES (starting permissions)</div><div style='display:flex;flex-direction:column;gap:8px'>";
  [["admin","var(--red)","Full access — everything"],["finance","var(--gold)","Add transactions + send reminders"],["secretary","var(--teal)","Post notices + upload docs"],["member","var(--mut)","View only — use toggles below to grant extra access"]].forEach(function(r){h+="<div style='display:flex;align-items:center;gap:10px;padding:8px 11px;background:var(--s2);border-radius:9px;border:1px solid var(--bor)'><span class='bdg' style='background:"+r[1]+"18;color:"+r[1]+";border:1px solid "+r[1]+"30'>"+r[0]+"</span><div style='font-size:12px;color:var(--mut)'>"+r[2]+"</div></div>";});
  h+="</div></div>";
  // Reset
  h+="<div class='card' style='border-color:var(--gold)22'><div style='display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px'><div><div style='color:var(--gold);font-size:11px;font-weight:700;margin-bottom:3px'>MEMBER DATA RESET</div><div style='color:var(--mut);font-size:12px'>Restore member profiles. Transactions NOT deleted.</div></div><button onclick='resetMembers()' style='padding:9px 15px;border-radius:9px;border:1px solid var(--gold);background:#1c0e00;color:var(--gold);font-weight:700;font-size:12px;cursor:pointer'>⚙ Reset</button></div></div>";
  // Members
  S.mems.forEach(function(m){
    var role=m.role||"member";var rc=RC[role]||RC.member;
    var isSelf=m.email===S.email;
    var sid=m.id.replace(/-/g,"_");
    var perms=m.permissions||{};
    h+="<div class='card'>";
    // Header row with photo
    h+="<div style='display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap'>";
    h+=avM(m,44);
    h+="<div style='flex:1;min-width:0'>";
    h+="<div style='display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:3px'><span style='font-weight:800;font-size:14px'>"+m.name+"</span>"+(isSelf?"<span class='bdg' style='background:var(--s2);border:1px solid var(--bor);color:var(--mut)'>YOU</span>":"")+"</div>";
    h+="<div style='font-size:11px;color:var(--mut)'>"+m.email+"</div>";
    h+="<div style='font-size:11px;color:"+rc.C+";font-weight:600;margin-top:2px'>"+rc.L+"</div>";
    h+="</div>";
    // Photo upload button (admin can upload for any member)
    h+="<button onclick='openPhotoUpload(\""+m.id+"\")' style='padding:8px 12px;border-radius:9px;border:1px solid var(--bor);background:var(--s2);color:var(--mut);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;flex-shrink:0'>"+(m.photo?"📷 Change Photo":"📷 Add Photo")+"</button>";
    h+="</div>";
    // Name + Phone
    h+="<div class='g2' style='margin-bottom:12px'>";
    h+="<div><label class='lbl'>Name</label><input id='nm-"+sid+"' type='text' class='inp' value='"+m.name+"'/></div>";
    h+="<div><label class='lbl'>Phone</label><input id='ph-"+sid+"' type='text' class='inp' value='"+(m.phone||"")+"'/></div></div>";
    // Title
    h+="<div style='margin-bottom:12px'><label class='lbl'>Title"+(m.locked?" 🔒":"")+"</label>";
    if(m.locked)h+="<div class='inp' style='color:var(--mut)'>"+m.title+"</div>";
    else h+="<input id='tl-"+sid+"' type='text' class='inp' value='"+m.title+"'/>";
    h+="</div>";
    // Role
    h+="<div style='margin-bottom:14px'><label class='lbl'>Base Role</label>";
    h+="<select id='rl-"+sid+"' class='inp'>"+Object.keys(RC).map(function(k){return"<option value='"+k+"'"+(role===k?" selected":"")+">"+RC[k].L+"</option>";}).join("")+"</select></div>";
    // Permission toggles
    h+="<div style='background:var(--s2);border:1px solid var(--bor);border-radius:11px;padding:12px 14px;margin-bottom:12px'>";
    h+="<div style='font-size:10px;color:var(--mut);font-weight:700;letter-spacing:1px;margin-bottom:10px'>⚡ EXTRA PERMISSIONS (overrides base role)</div>";
    PERMS.forEach(function(perm){
      var isGranted=!!perms[perm.key];
      h+="<div class='perm-row'>";
      h+="<div class='perm-info'><div class='pm-label' style='font-size:12px;font-weight:700'>"+perm.label+"</div><div class='pm-desc' style='font-size:10px;color:var(--mut);margin-top:2px'>"+perm.desc+"</div></div>";
      h+="<input type='checkbox' id='perm-"+perm.key+"-"+sid+"' class='tog'"+(isGranted?" checked":"")+"/>";
      h+="</div>";
    });
    h+="</div>";
    // Google link
    h+="<div style='background:var(--s2);border-radius:9px;padding:10px 12px;border:1px solid var(--bor);margin-bottom:12px'>";
    h+="<div style='font-size:10px;color:var(--mut);font-weight:700;margin-bottom:5px'>GOOGLE ACCOUNT</div>";
    if(m.googleUid)h+="<div style='font-size:12px;color:var(--grn);font-weight:600;margin-bottom:6px'>✓ Linked"+(m.googleEmail?" ("+m.googleEmail+")":"")+"</div><button onclick='unlinkGoogle(\""+m.id+"\")' class='btn-d' style='font-size:11px;padding:4px 10px'>Unlink</button>";
    else h+="<div style='font-size:12px;color:var(--mut)'>Not linked · Invite code: <strong style='color:var(--txt)'>"+m.id+"</strong></div>";
    h+="</div>";
    h+="<button class='btn-p' onclick='saveMemCtrl(\""+m.id+"\",\""+sid+"\","+(m.locked?"true":"false")+")' style='padding:11px'>💾 Save Changes</button>";
    h+="</div>";
  });
  h+="</div>";
  setTimeout(loadPendingApprovals,100);
  return h;
}
function saveMemCtrl(mid,sid,locked){
  var mem=S.mems.find(function(m){return m.id===mid;});if(!mem)return;
  var nm=($("nm-"+sid)||{value:mem.name}).value.trim()||mem.name;
  var ph=($("ph-"+sid)||{value:""}).value.trim();
  var rl=($("rl-"+sid)||{value:mem.role||"member"}).value;
  var permKeys=["sendPaymentReminder","sendNotices","uploadDocuments","addTransaction","manageProjects"];
  var permissions={};
  permKeys.forEach(function(pk){var el=$("perm-"+pk+"-"+sid);permissions[pk]=el?el.checked:false;});
  var upd={name:nm,phone:ph,role:rl,permissions:permissions};
  if(!locked&&$("tl-"+sid))upd.title=$("tl-"+sid).value.trim()||mem.title;
  db.collection("members").doc(mid).update(upd).then(function(){
    Object.assign(mem,upd);
    if(mem.email===S.email){S.name=nm;S.role=rl;setLabels();buildNav();}
    logAct("save_member",nm+" — role: "+rl);
    toast("Saved! Permissions updated for "+nm);
  }).catch(function(e){toast(e.message,false);});
}
function loadPendingApprovals(){var el=$("ctrl-pending");if(!el)return;db.collection("pendingApprovals").where("status","==","pending").get().then(function(snap){if(snap.empty){el.innerHTML="";return;}el.innerHTML="<div class='card' style='border-color:var(--gold)44;margin-bottom:0'><div style='color:var(--gold);font-size:11px;font-weight:700;margin-bottom:12px'>⏳ PENDING REGISTRATIONS ("+snap.size+")</div><div style='display:flex;flex-direction:column;gap:8px'>"+snap.docs.map(function(doc){var d=doc.data();return"<div style='display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--s2);border-radius:10px;border:1px solid var(--bor);flex-wrap:wrap'>"+av(d.name,32)+"<div style='flex:1'><div style='font-weight:700;font-size:13px'>"+d.name+"</div><div style='font-size:11px;color:var(--mut)'>"+d.email+"</div><div style='font-size:11px;color:var(--mut)'>Code: "+d.memberId+"</div></div><div style='display:flex;gap:6px'><button onclick='approveReg(\""+doc.id+"\",\""+d.memberId+"\")' class='btn-a' style='padding:6px 12px;font-size:11px'>Approve</button><button onclick='rejectReg(\""+doc.id+"\",\""+d.memberId+"\")' class='btn-d' style='padding:6px 12px;font-size:11px'>Reject</button></div></div>";}).join("")+"</div></div>";});}
function approveReg(docId,memberId){if(!confirm("Approve this registration?"))return;db.collection("pendingApprovals").doc(docId).update({status:"approved"}).then(function(){return db.collection("members").doc(memberId).update({status:"active"});}).then(function(){toast("Approved!");loadPendingApprovals();}).catch(function(e){toast(e.message,false);});}
function rejectReg(docId,memberId){if(!confirm("Reject?"))return;db.collection("pendingApprovals").doc(docId).update({status:"rejected"}).then(function(){return db.collection("members").doc(memberId).update({status:"rejected"});}).then(function(){toast("Rejected.");loadPendingApprovals();}).catch(function(e){toast(e.message,false);});}
function resetMembers(){if(!confirm("Reset all member profiles to defaults?\n\nThis clears phone numbers, addresses, google links.\nTransactions are NOT deleted."))return;var batch=db.batch();DEF_MEMS.forEach(function(m){batch.set(db.collection("members").doc(m.id),m);});batch.commit().then(function(){loadMembers(function(){render();toast("Members reset!");});logAct("reset_members","All reset");}).catch(function(e){toast(e.message,false);});}

// Close profile on outside click
document.addEventListener("click",function(e){
  var pd=$("prof-drop");
  if(pd&&pd.style.display==="block"&&!e.target.closest("#prof-btn"))pd.style.display="none";
});
</script>
